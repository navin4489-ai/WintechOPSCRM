# Render Blueprint — Wintech POS Platform
# Provisions the API+SPA web service and a fresh PostgreSQL database.
#
# Database reset is disabled. Never enable it on a live outlet.

services:
  - type: web
    name: the-bathany
    runtime: docker
    region: oregon
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        fromDatabase:
          name: the-bathany-db
          property: connectionString
      - key: Jwt__Key
        generateValue: true
      - key: RESET_DB_ON_START
        value: "false"
      - key: INITIAL_ADMIN_PASSWORD
        sync: false

databases:
  - name: the-bathany-db
    databaseName: oro_pos
    plan: free
    postgresMajorVersion: "17"
