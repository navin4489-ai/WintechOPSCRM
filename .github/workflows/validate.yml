name: Validate POS release
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet test backend/ORO_POS.Tests/ORO_POS.Tests.csproj -c Release --nologo
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/oro-pos-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/oro-pos-web/package-lock.json
      - run: npm ci
      - run: npm run build -- --configuration production
      - run: npx playwright install --with-deps chromium
      - run: npm run test:responsive
  android-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Private Android release keys are intentionally not available to PR builds.
