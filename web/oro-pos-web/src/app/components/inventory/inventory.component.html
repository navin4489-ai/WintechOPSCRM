<div class="page">
  <h1>Inventory Management</h1>
  <div class="grid">
    <div class="panel">
      <h3>Stock Levels</h3>
      <table>
        <thead><tr><th>Product</th><th>SKU</th><th>Stock</th><th>Status</th></tr></thead>
        <tbody>
          <tr *ngFor="let p of stock" [class.low]="p.isLowStock">
            <td>{{p.productName}}</td><td>{{p.sku}}</td><td>{{p.currentStock | number:'1.2'}}</td>
            <td><span class="badge" [class.low]="p.isLowStock">{{p.isLowStock ? 'LOW' : 'OK'}}</span></td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="panel">
      <h3>Record Movement</h3>
      <div class="form-group">
        <label>Movement Type</label>
        <select [(ngModel)]="movement.movementType">
          <option value="Receipt">Receipt</option>
          <option value="Sale">Sale</option>
          <option value="Waste">Waste</option>
          <option value="Adjustment">Adjustment</option>
        </select>
      </div>
      <div class="form-group">
        <label>Quantity</label>
        <input type="number" [(ngModel)]="movement.quantity" />
      </div>
      <button (click)="recordMovement()">Record</button>
    </div>
  </div>
</div>
